<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Support</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-white shadow-sm">
    <div class="container">
      <a class="navbar-brand text-teal fw-bold" href="{{ url_for('index') }}">IT Support</a>
      <div class="d-flex">
        {% if session.get('username') %}
          <span class="me-3">Signed in as <strong>{{ session['username'] }}</strong></span>
          <a class="btn btn-outline-teal me-2" href="{{ url_for('new_ticket') }}">New Ticket</a>
          {% if session.get('is_admin') %}
            <a class="btn btn-dark me-2" href="{{ url_for('admin_dashboard') }}">Admin</a>
          {% endif %}
          <a class="btn btn-danger" href="{{ url_for('logout') }}">Logout</a>
        {% else %}
          <a class="btn btn-teal me-2" href="{{ url_for('login') }}">Login</a>
          <a class="btn btn-outline-teal" href="{{ url_for('register') }}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Main container -->
  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <footer class="text-center py-3 mt-4">
    <small class="text-muted">IT Support System — Demo (do not deploy)</small>
  </footer>

</body>
</html>
